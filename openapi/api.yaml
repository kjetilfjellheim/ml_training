openapi: 3.1.0
info:
  title: ML Training API
  version: 0.1.0
  description: Minimal contract-first API scaffold built with Actix Web.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/greetings/{name}:
    get:
      operationId: getGreeting
      summary: Return a greeting for the requested name
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Greeting payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreetingResponse'
  /openapi:
    get:
      operationId: getOpenApiContract
      summary: Return the raw OpenAPI contract
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    GreetingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Hello, Ada!